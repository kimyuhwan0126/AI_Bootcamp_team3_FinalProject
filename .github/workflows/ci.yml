# ─────────────────────────────────────────────────────────────
# CI — 사람 리뷰 전에 기계가 먼저 잡는다
#
# 왜 스모크 테스트까지 도는가
#   이 프로젝트에서 `npx tsc --noEmit` 과 `npm run build` 를 **둘 다 통과**하고도
#   모임 상세 화면이 통째로 안 그려진 적이 있다(useEffect 를 조건부 return 뒤에
#   둔 경우). 타입검사·빌드는 "렌더링된다"를 보장하지 않는다.
#   실제로 브라우저를 띄워 핵심 경로를 클릭해봐야 잡힌다.
#
# 왜 매트릭스인가
#   flags-off = 발표에 쓸 기본 경로.
#   flags-on  = 꺼둔 기능(AI 채팅 등)이 썩지 않았는지. 안 돌려보는 플래그는
#               "언제든 켤 수 있는 코드"가 아니라 "켤 수 있어 보이는 죽은 코드"다.
#
# 외부 API 키는 CI 에 넣지 않는다. 키 없이도 mock 폴백으로 전체 플로우가
# 돌아야 한다는 게 프로젝트 규칙(CLAUDE.md §4)이라, CI 가 그 규칙의 검사이기도 하다.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flags-off
            ff_ai_chat: "0"
            ff_station: "0"
          - name: flags-on
            ff_ai_chat: "1"
            ff_station: "1"
    name: verify (${{ matrix.name }})
    env:
      NEXT_PUBLIC_FF_AI_CHAT: ${{ matrix.ff_ai_chat }}
      # ⚠️ `NEXT_PUBLIC_FF_*` 는 **빌드 시점에 문자열로 박힌다.** 그래서 켠 상태를
      #    검사하려면 이렇게 잡을 통째로 하나 더 돌리는 수밖에 없다
      #    (테스트 안에서 process.env 를 바꿔도 이미 박힌 값은 안 바뀐다).
      #    `tests/station-snap.spec.ts` 가 /api/status 로 지금 빌드를 확인하고
      #    자기가 검사할 계약을 고른다.
      NEXT_PUBLIC_FF_PING_SNAP_STATION: ${{ matrix.ff_station }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc 하나로 CI 와 팀원 로컬의 Node 버전을 맞춘다
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 스모크 (실제로 브라우저에서 열어본다)
        run: npm run test:smoke

      - name: 실패 시 스크린샷·트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  # ── CHANGELOG 기입 확인 ─────────────────────────────────────────
  #  루트 CLAUDE.md §6: "파일을 바꿨으면 CHANGELOG.md 에 반드시 기입한다."
  #  기억에 의존하면 바쁠 때 빠진다 — 빠진 채로 3주가 지나면 무엇을 왜 바꿨는지
  #  아무도 복원할 수 없다. 그래서 기계가 확인한다.
  #
  #  코드·설정 변경만 대상이다. 문서만 고친 PR 은 통과시킨다(문서는 그 자체가 기록).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG 기입 확인
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE" --quiet
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD")

          echo "── 이 PR 이 바꾼 파일 ──"
          echo "$CHANGED"
          echo

          # 기록이 필요한 변경인가 (코드·설정)
          NEEDS=$(echo "$CHANGED" | grep -E '^(app/|lib/|tests/|db/|\.github/|package\.json|package-lock\.json|tsconfig\.json|next\.config\.mjs|playwright\.config\.ts|\.nvmrc|\.eslintrc\.json|\.gitignore|\.env\.example)' || true)

          if [ -z "$NEEDS" ]; then
            echo "✅ 문서만 바뀐 PR — CHANGELOG 기입 생략 가능"
            exit 0
          fi

          if echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "✅ CHANGELOG.md 에 기입됨"
            exit 0
          fi

          echo "❌ 코드·설정을 바꿨는데 CHANGELOG.md 에 기록이 없습니다."
          echo
          echo "기록이 필요한 변경:"
          echo "$NEEDS" | sed 's/^/  /'
          echo
          echo "CHANGELOG.md 의 표에 한 줄 추가하세요:"
          echo "  | 날짜 | 작업자 | 대상 파일 | 무엇을 바꿨나 | 왜 |"
          echo
          echo "(루트 CLAUDE.md §6 — 기록 없는 변경 금지)"
          exit 1
