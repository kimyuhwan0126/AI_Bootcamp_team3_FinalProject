# CI: 타입체크 + 순수 셈 시험 + 프로덕션 빌드.
#
# tests/*.mjs 대부분은 여전히 제외한다 — 살아있는 DB(Neon)와 떠 있는 dev 서버가 필요해서,
# CI에 넣으려면 저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL 등을
# 등록하는 별도 결정이 먼저 필요하다(레포 소유자 판단 사항).
#
# 다만 `npm test` 가 도는 둘(tests/지도셈.mjs · tests/시트스냅.mjs)은 **아무것도 안 부른다** —
# lib/ 밑 순수 함수만 건드리므로 서버도 DB도 없이 돈다. 홈 화면을 목업 구조로 옮기면서
# 지도 여백 셈과 시트 스냅 셈을 거기로 뽑아냈고, 그 둘은 눈으로 봐서는 틀린 걸 못 알아챈다
# (핀이 시트 밑에 반쯤 깔리는 식으로 조용히 어긋난다). 그래서 여기서 막는다.
#
# ⚠ node 22 가 필요하다 — 시험이 `.ts` 를 그대로 읽는 데 `--experimental-strip-types` 를 쓴다.
#   20.x 에는 그 깃발이 없다(그래서 아래 node-version 을 올렸다).
#
# ⚠ 빌드 단계에는 그래도 DATABASE_URL 이 있어야 한다 — 실제로 값 없이 돌려 보니 깨졌다:
#   lib/db.ts·lib/geo.ts 가 `const sql = neon(process.env.DATABASE_URL!, …)` 로 모듈
#   맨 위에서 곧바로 클라이언트를 만든다(lib/places.ts 처럼 함수 안에서 늦게 만들지 않는다).
#   /api/auth/[...nextauth] 라우트가 이 모듈을 불러오기만 해도 Next 의 "페이지 데이터
#   모으기" 단계에서 그 줄이 실행돼 `Error: No database connection string was provided`
#   로 빌드 자체가 죽는다 — 로컬은 .env.local 이 있어서 안 걸렸을 뿐이다.
#   아래 값은 **진짜 DB 에 안 닿는다** — neon() 생성자를 통과시키는 모양만 맞춘 가짜 값이다.
#   실제 연결은 배포 서버(Vercel)의 진짜 DATABASE_URL 이 한다.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run check

      - name: 순수 셈 시험 (지도 여백 · 시트 스냅)
        run: npm test

      - name: 프로덕션 빌드
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npm run build
