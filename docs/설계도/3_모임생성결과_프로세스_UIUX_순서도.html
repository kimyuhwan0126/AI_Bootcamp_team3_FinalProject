<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모이머 모임생성결과 프로세스 UI/UX 순서도</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F4F6FA;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #wrap{position:fixed;inset:0;cursor:grab;touch-action:none}
  #wrap.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;user-select:none}
  .ctrl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .ctrl button{width:42px;height:42px;font-size:19px;border:1px solid #C9CFDA;background:#fff;border-radius:9px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.10);color:#41556F}
  .ctrl button:hover{background:#EAF0FC}
  .hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:#5D6670;background:#ffffffcc;padding:6px 12px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .shot .ctrl,.shot .hint{display:none}
</style>
</head>
<body>
<div id="wrap"><svg id="svg"><g id="world"></g></svg></div>
<div class="ctrl">
  <button id="zi" title="확대">＋</button>
  <button id="zo" title="축소">－</button>
  <button id="zr" title="전체 보기">⟳</button>
</div>
<div class="hint">🖱 휠 = 확대/축소 · 드래그 = 이동 · 더블클릭 = 확대 · ⟳ = 전체 보기</div>
<script>
"use strict";
/* ── 모이머 모임생성결과 프로세스 UI/UX 순서도 — 역할 스윔레인 × 화면 목업 ──
   레인: 방장(위) · 공유 화면(중앙) · 참여자(아래). 「모이머 전체 화면 순서도 — 설계 확정판」 v19 기준.
   방장 전용 액션은 방장 레인 카드, 참여자 예외 흐름은 참여자 레인 카드로 분산. */
const W = 2440, H = 1690;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let out = "";

const C = {
  brand:"#2F6BFF", green:"#2E7D32", orange:"#E8944A", ai:"#6C5CE7",
  kakao:"#FDD835", danger:"#E11D48", ink:"#22252B", sub:"#6B7280",
  map:"#E9F0E7", road:"#FFFFFF", card:"#FFFFFF", line:"#D8DEE8",
  p1:"#E8574B", p2:"#2F80ED", p3:"#F2994A", gray:"#9AA3AF"
};

/* ── 기본 도형 헬퍼 ── */
function R(x,y,w,h,r,fill,stroke,sw,dash){
  out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"`
       + (stroke?` stroke="${stroke}" stroke-width="${sw||1}"`:"")
       + (dash?` stroke-dasharray="${dash}"`:"") + `/>`;
}
function T(x,y,s,size,fill,w,anchor){
  out += `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}"`
       + (w?` font-weight="${w}"`:"") + (anchor?` text-anchor="${anchor}"`:"") + `>${esc(s)}</text>`;
}
function pin(x,y,color,rr){
  rr = rr || 6;
  out += `<path d="M${x},${y} L${x-rr*0.75},${y-rr} A${rr},${rr} 0 1 1 ${x+rr*0.75},${y-rr} Z" fill="${color}"/>`;
  out += `<circle cx="${x}" cy="${y-rr-1.5}" r="${rr*0.42}" fill="#fff"/>`;
}
function badge(cx,cy,txt,fill,tc,dash){
  const w = txt.length*8.2+12;
  R(cx-w/2,cy-8,w,16,8,fill,dash?tc:null,1,dash?"3 2":null);
  T(cx,cy+3.5,txt,8.5,tc,700,"middle");
}
function btn(x,y,w,h,txt,fill,tc,dash,stroke){
  R(x,y,w,h,h/2*0.6,fill,stroke||null,1.2,dash?"4 3":null);
  T(x+w/2,y+h/2+3.5,txt,9,tc,700,"middle");
}
function input(x,y,w,label,val){
  R(x,y,w,20,5,"#F3F5F9","#D8DEE8",1);
  T(x+7,y+13.5,label,8.5,val?"#22252B":"#98A2B3",val?600:400);
}
function mapBg(ox,oy,w,h){
  R(ox,oy,w,h,0,C.map);
  out += `<path d="M${ox},${oy+h*0.3} L${ox+w},${oy+h*0.22} M${ox+w*0.35},${oy} L${ox+w*0.42},${oy+h} M${ox},${oy+h*0.72} L${ox+w},${oy+h*0.66}" stroke="${C.road}" stroke-width="5" fill="none"/>`;
}
function tabbar(ox,oy,active){
  R(ox,oy,184,30,0,"#FFFFFF","#E3E7EF",1);
  ["홈","모임","내정보"].forEach((t,i)=>{
    T(ox+31+i*61,oy+19,t,8.5,i===active?C.brand:"#98A2B3",i===active?700:400,"middle");
  });
}
function progress(ox,oy,txt){
  R(ox+8,oy,168,18,9,"#FFFFFF","#D8DEE8",1);
  R(ox+13,oy+5,60,8,4,"none","#D8DEE8",1);
  R(ox+13,oy+5,45,8,4,C.brand);
  T(ox+80,oy+12.5,txt,7.2,"#374151",600);
}

/* ── 레인 ── */
const lanes = [
  { id:"host",   label:"방장",     sub:"카카오 로그인 필수",      y:78,   h:512, c:"#EAF1FB" },
  { id:"shared", label:"공유 화면", sub:"전원 · 지도 중심 · 폴링", y:590,  h:512, c:"#F3F6F1" },
  { id:"part",   label:"참여자",   sub:"이름만 · PIN(비로그인)",  y:1102, h:512, c:"#FDF3E7" },
];
const laneTop = Object.fromEntries(lanes.map(l => [l.id, l.y + 58]));

/* ── 폰 프레임 (top = 레인별 프레임 상단) ── */
function phone(cx, top, title, badgeTxt, badgeColor){
  R(cx-100, top, 200, 400, 30, "#23252B");
  R(cx-92,  top+8, 184, 384, 22, "#FFFFFF");
  R(cx-28,  top+8, 56, 9, 4.5, "#23252B");
  T(cx, top-24, title, 14, "#22252B", 700, "middle");
  const w = badgeTxt.length*10+16;
  R(cx-w/2, top-16, w, 15, 7.5, badgeColor);
  T(cx, top-4.5, badgeTxt, 8.5, "#fff", 700, "middle");
  return [cx-92, top+8];
}
function caption(cx, top, lines){
  lines.forEach((l,i)=> T(cx, top+424+i*16, l, 9.5, "#5D6670", i===0?600:400, "middle"));
}
/* 레인 카드 (방장·참여자 전용 액션) */
function card(cx, cy, t1, t2, fill, stroke){
  R(cx-95, cy-28, 190, 56, 8, fill||"#FDF6C9", stroke||"#B8A94A", 1.4);
  T(cx, cy-6, t1, 10, "#3B3A20", 700, "middle");
  T(cx, cy+12, t2, 8.5, "#6B6A4E", 400, "middle");
}

/* ══════════ 제목 ══════════ */
T(20, 34, "모이머 모임생성결과 프로세스 UI/UX 순서도 — 역할 스윔레인 × 화면 목업", 22, "#22252B", 700);
T(20, 56, "설계 확정판 v19 (2026-08-07) · 행 = 역할 · 폰 = 실제 화면 목업 · 노랑 카드 = 그 역할의 전용 액션 · 위 점선 = '지역까지' 건너뜀 · 아래 점선 = reopen 사다리", 12, "#5D6670");

/* ── 레인 배경 + 라벨 ── */
for (const l of lanes) {
  R(8, l.y, W-16, l.h, 0, l.c);
  out += `<line x1="8" y1="${l.y}" x2="${W-8}" y2="${l.y}" stroke="#fff" stroke-width="2"/>`;
  const cy = l.y + l.h/2;
  R(18, cy-23, 136, 46, 4, "#fff", "#D64545", 2);
  T(86, cy-2, l.label, 14, "#212B36", 700, "middle");
  T(86, cy+14, l.sub, 8.5, "#5D6670", 400, "middle");
}

const X = [260, 550, 840, 1130, 1420, 1710, 2000, 2290];
const HT = laneTop.host, ST = laneTop.shared, PT = laneTop.part;
const SMID = ST + 200;

/* ══════════ 흐름 화살표 (폰보다 먼저 그려 겹침 방지) ══════════ */
/* ① → ② : 홈(공유) → 생성(방장) */
out += `<path d="M${X[0]+100},${SMID} L375,${SMID} L375,${HT+200} L${X[1]-107},${HT+200}" fill="none" stroke="#5B6472" stroke-width="2" marker-end="url(#arw)"/>`;
R(379, 720, 164, 18, 9, "#fff", "#98A2B3", 1);
T(461, 733, "'이 출발지들로 모임 만들기'", 10, "#374151", 700, "middle");
/* ② → ③ : 생성(방장) → 참여(참여자) */
out += `<path d="M${X[1]},584 L${X[1]},${PT-40}" fill="none" stroke="#5B6472" stroke-width="2" marker-end="url(#arw)"/>`;
R(X[1]-92, 820, 184, 20, 10, "#fff", "#98A2B3", 1);
T(X[1], 834, "초대 링크 공유 (카카오톡)", 10, "#374151", 700, "middle");
/* ③ → ④ : 참여(참여자) → 핑 등록(공유) */
out += `<path d="M${X[1]+85},${PT} L${X[1]+85},${SMID} L${X[2]-107},${SMID}" fill="none" stroke="#5B6472" stroke-width="2" marker-end="url(#arw)"/>`;
R(X[1]+85-88, 990, 176, 20, 10, "#fff", "#98A2B3", 1);
T(X[1]+85, 1004, "참여 완료 · 비로그인은 PIN", 10, "#374151", 700, "middle");
/* ④→⑤→⑥→⑦→⑧→⑨ : 공유 레인 가로 흐름 */
const steps = [
  ["투표 시작","방장 · 핑 잠금"],
  ["지역 확정","'지점까지'"],
  ["투표 시작","후보 잠금"],
  ["지점 확정","경로 API 호출"],
  ["다음날 '지난 모임'","허브 ↔ 단계"],
];
for (let i = 2; i < 6; i++) {
  const x1 = X[i]+100, x2 = X[i+1]-100;
  out += `<path d="M${x1},${SMID} L${x2-7},${SMID}" stroke="#5B6472" stroke-width="2" marker-end="url(#arw)"/>`;
  T((x1+x2)/2, SMID-26, steps[i-2][0], 8.6, "#374151", 700, "middle");
  T((x1+x2)/2, SMID-14, steps[i-2][1], 8.6, "#374151", 400, "middle");
}
/* ⑧ → ⑨ (허브, 점선) */
out += `<path d="M${X[6]+100},${SMID} L${X[7]-107},${SMID}" stroke="#5B6472" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw)"/>`;
T((X[6]+X[7])/2, SMID-26, steps[4][0], 8.6, "#374151", 700, "middle");
T((X[6]+X[7])/2, SMID-14, steps[4][1], 8.6, "#374151", 400, "middle");

/* '지역까지' 건너뜀 — ⑤ 상단 → ⑧ 상단 (제목 위 통로 y≈604) */
out += `<path d="M${X[3]+85},${ST-2} L${X[3]+85},602 L${X[6]-85},602 L${X[6]-85},${ST-4}" fill="none" stroke="${C.green}" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arwg)"/>`;
R((X[3]+X[6])/2-168, 586, 336, 19, 9.5, "#fff", C.green, 1.2);
T((X[3]+X[6])/2, 600, "'지역까지' 모임 — ⑥·⑦ 건너뜀 · 경로 없이 지도만", 10, C.green, 700, "middle");

/* reopen 사다리 — ⑧ 하단 → ⑤ 하단 (캡션 아래 통로 y=1150) */
out += `<path d="M${X[6]},1104 L${X[6]},1150 L${X[3]},1150 L${X[3]},1108" fill="none" stroke="#8A93A2" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arwd)"/>`;
R((X[3]+X[6])/2-212, 1140, 424, 20, 10, "#fff", "#8A93A2", 1.2);
T((X[3]+X[6])/2, 1154, "방장 되돌리기 — reopen 사다리: 확정 → 투표 다시 → 후보부터 다시 (표 유지)", 9.5, "#5D6670", 700, "middle");

/* ══════════ 방장 레인 카드 (해당 열의 공유 화면에서 방장만 하는 것) ══════════ */
card(X[2], 470, "방장 · AI 추천 + 투표 시작", "재호출 교체/추가 팝업 · 1개면 생략");
card(X[3], 470, "방장 · 지역 확정", "동점: 재량 or 재투표 (무제한)");
card(X[4], 470, "방장 · AI 지점 추천 (선택)", "ECO ~9초 · 반경·카테고리 기준");
card(X[5], 470, "방장 · 지점 확정", "확정 즉시 경로 API 호출 · 동점은 재량/재투표");
card(X[6], 470, "방장 · 되돌리기·승격·강퇴·삭제", "reopen 사다리 · '지점도 정하기'");
T(X[4], 408, "▼ 노랑 카드 = 아래 열의 공유 화면에서 방장에게만 보이는 버튼", 10, "#5D6670", 600, "middle");

/* ══════════ 참여자 레인 카드 (예외 흐름) ══════════ */
card(X[2], 1240, "이름 중복 팝업", "별칭 붙이기 또는 PIN 복구");
card(X[2], 1330, "8명 초과 — 입장 거부", "초과분은 유료 구간 구상");
out += `<path d="M${X[1]+100},1240 L${X[2]-102},1240 M${X[1]+100},1330 L${X[2]-102},1330" stroke="#8A93A2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwd)"/>`;
R(X[2]+115, 1316, 76, 28, 14, "#3F5E9E", "#31497C", 1.6);
T(X[2]+153, 1334, "END", 12, "#fff", 700, "middle");
out += `<path d="M${X[2]+95},1330 L${X[2]+108},1330" stroke="#5B6472" stroke-width="1.6" marker-end="url(#arw)"/>`;
card(X[3], 1240, "늦은 참여자", "확정 전 투표 가능 · 핑은 잠금");
card(X[6], 1240, "신호등 자가신고 (전원)", "노랑=지각 분 입력 · 전원 공유");
T(X[4]+145, 1244, "▲ 카드 = 위 열의 화면에서 참여자에게 일어나는 예외·행동", 10, "#5D6670", 600, "middle");

/* ══════════ P1 홈 (공유) ══════════ */
{
  const [ox,oy] = phone(X[0], ST, "① 홈 — 중간지점 맛보기", "전원 · 로그인 없음", C.brand);
  mapBg(ox, oy+52, 184, 230);
  R(ox+8, oy+22, 168, 22, 11, "#fff", "#D8DEE8", 1);
  T(ox+18, oy+36, "출발지 검색  ·  대중교통|자차", 8, "#98A2B3");
  ;[C.p1,C.p2,C.p3].forEach((c,i)=>{ R(ox+8+i*58, oy+48, 52, 16, 8, "#fff", "#D8DEE8", 1); out += `<circle cx="${ox+17+i*58}" cy="${oy+56}" r="4.5" fill="${c}"/>`; T(ox+25+i*58, oy+59.5, "출발지"+(i+1), 7, "#374151"); });
  pin(ox+40, oy+130, C.p1); pin(ox+150, oy+110, C.p2); pin(ox+112, oy+215, C.p3);
  badge(ox+92, oy+152, "중간지점", C.brand, "#fff");
  pin(ox+92, oy+176, C.brand, 7);
  out += `<circle cx="${ox+160}" cy="${oy+256}" r="13" fill="#fff" stroke="#D8DEE8"/>`;
  T(ox+160, oy+260, "📍", 10, "#374151", 400, "middle");
  R(ox+8, oy+288, 168, 26, 8, C.brand);
  T(ox+92, oy+304.5, "이 출발지들로 모임 만들기", 9.5, "#fff", 700, "middle");
  tabbar(ox, oy+346, 0);
  caption(X[0], ST, ["중간지점 1곳 · 탐색 모드 (호기심 유도)", "확정 시 출발지들은 '미배정 핑'으로 이관"]);
}

/* ══════════ P2 모임 생성 (방장) ══════════ */
{
  const [ox,oy] = phone(X[1], HT, "② 모임 생성", "방장 · 카카오 로그인", C.green);
  T(ox+12, oy+40, "모임 만들기", 12, "#22252B", 700);
  R(ox+108, oy+27, 68, 17, 8.5, C.kakao);
  T(ox+142, oy+38.5, "카카오 로그인됨", 7.5, "#3A2B00", 700, "middle");
  T(ox+12, oy+66, "모임 이름", 8, "#6B7280");
  input(ox+12, oy+72, 160, "우리 팀 회식", 1);
  T(ox+12, oy+112, "모임 시간 (선택 · 과거 불가)", 8, "#6B7280");
  input(ox+12, oy+118, 160, "8/14 (금) 19:00", 1);
  T(ox+12, oy+158, "확정 범위", 8, "#6B7280");
  R(ox+12, oy+164, 160, 22, 11, "#F3F5F9", "#D8DEE8", 1);
  R(ox+94, oy+166, 76, 18, 9, C.brand);
  T(ox+52, oy+178, "지역까지", 8.5, "#6B7280", 600, "middle");
  T(ox+132, oy+178, "지점까지", 8.5, "#fff", 700, "middle");
  T(ox+12, oy+206, "목적 카테고리 (카카오 분류 5종)", 8, "#6B7280");
  ;["음식","카페","술집","문화","야외"].forEach((c,i)=>{
    const on = i===0;
    R(ox+12+i*33, oy+212, 30, 18, 9, on?C.brand:"#F3F5F9", on?null:"#D8DEE8", 1);
    T(ox+27+i*33, oy+224, c, 8, on?"#fff":"#6B7280", on?700:400, "middle");
  });
  T(ox+12, oy+244, "내 출발지 · 이동수단 (방장도 원스텝)", 8, "#6B7280");
  input(ox+12, oy+250, 104, "역삼역", 1);
  R(ox+122, oy+250, 50, 20, 10, "#F3F5F9", "#D8DEE8", 1);
  R(ox+124, oy+252, 30, 16, 8, C.brand);
  T(ox+139, oy+263, "대중", 7.5, "#fff", 700, "middle");
  T(ox+163, oy+263, "차", 7.5, "#6B7280", 400, "middle");
  btn(ox+12, oy+330, 160, 30, "만들기 → 초대 링크 발급", C.green, "#fff");
  caption(X[1], HT, ["방장 출발지 원스텝(홈 경유 시 생략) · 이름은 프로필 자동", "'지역까지' 선택 시 카테고리 숨김 · 나중에 방장 수정 가능"]);
}

/* ══════════ P3 참여 폼 (참여자) ══════════ */
{
  const [ox,oy] = phone(X[1], PT, "③ 참여 — 링크 진입", "참여자 · 이름만", C.orange);
  T(ox+12, oy+40, "모임 참여", 12, "#22252B", 700);
  T(ox+12, oy+58, "초대 링크로 들어왔어요 · 비밀번호 없음", 7.5, "#6B7280");
  T(ox+12, oy+80, "이름 (원스텝 필수)", 8, "#6B7280");

/* ── 줌·팬 ── */
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
let k = 1, tx = 0, ty = 0;
function apply(){ world.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`); }
function fit(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  k = Math.min(vw / W, vh / H) * 0.97;
  tx = (vw - W * k) / 2; ty = (vh - H * k) / 2;
  apply();
}
function zoomAt(cx, cy, f){
  const nk = Math.min(6, Math.max(0.1, k * f));
  const r = nk / k;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk;
  apply();
}
wrap.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18); }, { passive:false });
let dragging = false, lx = 0, ly = 0;
wrap.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
wrap.addEventListener("pointerup", () => { dragging = false; wrap.classList.remove("drag"); });
wrap.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 1.6));
document.getElementById("zi").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.3);
document.getElementById("zo").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.3);
