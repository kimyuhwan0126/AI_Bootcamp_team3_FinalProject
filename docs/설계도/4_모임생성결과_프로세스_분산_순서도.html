<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모이머 모임생성결과 프로세스 분산 순서도</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F4F6FA;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #wrap{position:fixed;inset:0;cursor:grab;touch-action:none}
  #wrap.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;user-select:none}
  .ctrl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .ctrl button{width:42px;height:42px;font-size:19px;border:1px solid #C9CFDA;background:#fff;border-radius:9px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.10);color:#41556F}
  .ctrl button:hover{background:#EAF0FC}
  .hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:#5D6670;background:#ffffffcc;padding:6px 12px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .shot .ctrl,.shot .hint{display:none}
</style>
</head>
<body>
<div id="wrap"><svg id="svg"><g id="world"></g></svg></div>
<div class="ctrl">
  <button id="zi" title="확대">＋</button>
  <button id="zo" title="축소">－</button>
  <button id="zr" title="전체 보기">⟳</button>
</div>
<div class="hint">🖱 휠 = 확대/축소 · 드래그 = 이동 · 더블클릭 = 확대 · ⟳ = 전체 보기</div>
<script>
"use strict";
/* ── 모이머 모임생성결과 프로세스 분산 순서도 — 역할 스윔레인 ──
   「모이머 전체 화면 순서도 — 설계 확정판」 v19 기준. 행 = 역할(방장·참여자·시스템·AI), 열 = 진행 순서.
   노랑 = 처리 · 마름모 = 분기 · 주황 = 시작 · 남색 = 종료 · 점선 = 선택(AI)·복귀·오류 */
const W = 3560, H = 880;

const lanes = [
  { id:"host", label:"방장",   sub:"카카오 로그인 필수",        y: 70, h:170, c:"#EAF1FB" },
  { id:"part", label:"참여자", sub:"이름만 · 로그인 선택",      y:240, h:170, c:"#FDF3E7" },
  { id:"sys",  label:"시스템", sub:"자체서버 3100 · 1.8초 폴링", y:410, h:170, c:"#EAF6EC" },
  { id:"ai",   label:"AI",     sub:"GLM 5.2 · Ollama Cloud",   y:580, h:150, c:"#F3EFFA" },
];
const laneOf = Object.fromEntries(lanes.map(l => [l.id, l]));
const cyOf = id => laneOf[id].y + laneOf[id].h / 2;

/* type: start | end | proc | dec  ·  dash: 점선(선택·외부) */
const nodes = [
  { id:"st1",    lane:"host", x:205,  type:"start", t:["시작"] },
  { id:"home",   lane:"part", x:330,  type:"proc", dash:1, w:170, t:["(선택) 홈 맛보기","중간지점 1곳 → 탐색 모드","'이 출발지들로 모임 만들기'"] },
  { id:"create", lane:"host", x:330,  type:"proc", t:["모임 생성 — 방장 원스텝","이름(프로필)·출발지·이동수단","시간·확정 범위·목적 카테고리"] },
  { id:"share",  lane:"host", x:500,  type:"proc", t:["초대 링크 공유","카카오톡 /m/{code}"] },
  { id:"enter",  lane:"part", x:500,  type:"proc", t:["링크로 진입","늦은 참여: 확정 전 투표 가능"] },
  { id:"form",   lane:"part", x:670,  type:"proc", t:["참여 폼 — 원스텝 필수","이름·출발지·이동수단·개인 PIN","PIN은 비로그인만 (복구용)"] },
  { id:"dDup",   lane:"sys",  x:670,  type:"dec",  t:["이름 중복?"] },
  { id:"popup",  lane:"part", x:840,  type:"proc", w:130, h:36, t:["별칭 또는 PIN 복구"] },
  { id:"dCap",   lane:"sys",  x:970,  type:"dec",  t:["정원 8명","초과?"] },
  { id:"reject", lane:"part", x:1000, type:"proc", w:150, h:36, t:["입장 거부 — 유료 구상"] },
  { id:"endR",   lane:"part", x:1000, cy:264, type:"end", t:["END"] },
  { id:"ping",   lane:"part", x:1190, type:"proc", t:["지도에 핑 — 지역 후보 등록","누구나(방장 포함) · 인원당 1개","홈 '미배정 핑' 선택·수정"] },
  { id:"snap",   lane:"sys",  x:1190, type:"proc", t:["동 스냅 · 같은 동 병합","coord2regioncode","실패 시 좌표 폴백"] },
  { id:"aiBtn",  lane:"host", x:1370, type:"proc", dash:1, t:["AI 추천 버튼 (선택)","재호출: 교체/추가 선택 팝업"] },
  { id:"aiRun",  lane:"ai",   x:1370, type:"proc", dash:1, t:["ECO 원콜 — 지역 후보 3곳","~25초 · 실패: 토스트+재시도","성공: 병합 + 'AI 추천' 태그"] },
  { id:"lock",   lane:"host", x:1550, type:"proc", t:["투표 시작 — 핑 잠금","openChat · 이후 등록·이동 불가"] },
  { id:"dCnt",   lane:"sys",  x:1550, type:"dec",  t:["후보 수?"] },
  { id:"vote",   lane:"part", x:1740, type:"proc", t:["핀 탭 투표","1인 1표 · 재탭으로 변경"] },
  { id:"prog",   lane:"sys",  x:1740, type:"proc", t:["진행률 n/N · 미투표자","방장의 확정 판단 근거"] },
  { id:"dTie",   lane:"sys",  x:1930, type:"dec",  t:["동점?"] },
  { id:"tie",    lane:"host", x:1930, type:"proc", t:["방장 — 재량 선택","또는 재투표"] },
  { id:"confirm",lane:"host", x:2120, type:"proc", t:["지역 확정","confirmManual"] },
  { id:"dScope", lane:"sys",  x:2120, type:"dec",  t:["확정 범위?"] },
  { id:"radius", lane:"sys",  x:2320, type:"proc", t:["반경 700m 표시","확정 동 중심 · 밖은 거부"] },
  { id:"poi",    lane:"part", x:2320, type:"proc", t:["카테고리·검색 POI 조회","누구나 · 목적 카테고리 포커싱","가까운순·별점순 (카카오 웹)"] },
  { id:"dPoi",   lane:"sys",  x:2510, type:"dec",  t:["반경 내","POI 0개?"] },
  { id:"reg",    lane:"part", x:2510, type:"proc", t:["미리보기 핀 → 후보 등록","상한 없음 · 방장·본인 삭제"] },
  { id:"aiBtn2", lane:"host", x:2700, type:"proc", dash:1, t:["AI 지점 추천 (선택)","ECO ~9초 · 반경·카테고리"] },
  { id:"aiRun2", lane:"ai",   x:2700, type:"proc", dash:1, t:["지점 후보 3곳 공급","실패·병합 규칙 지역과 동일"] },
  { id:"lock2",  lane:"host", x:2890, type:"proc", t:["투표 시작 — 지점","규칙 동일 · 1개면 투표 생략"] },
  { id:"vote2",  lane:"part", x:2890, type:"proc", t:["핀 탭 투표 — 지점","동점·진행률 규칙 동일"] },
  { id:"confirm2",lane:"host",x:3080, type:"proc", t:["지점 확정","confirmManual"] },
  { id:"route",  lane:"sys",  x:3080, type:"proc", t:["경로 API — 이때만 호출","각자 출발지 → 확정 지점","'지역까지'는 경로 없이 지도만"] },
  { id:"light",  lane:"part", x:3270, type:"proc", t:["도착 신호등 — 상황 변경","노랑=지각(분 공유) · 빨강=불참","당일만 활성 · '지역까지'는 숨김"] },
  { id:"kakaoLink", lane:"host", x:3270, type:"proc", dash:1, t:["지점 카카오 링크 연결","카카오맵 상세 · 지점 모임만"] },
  { id:"endF",   lane:"host", x:3450, type:"end", w:90, t:["지난 모임"] },
  { id:"me",     lane:"part", x:3450, type:"proc", w:190, t:["내정보 탭 /me — 상시","기본 출발지·이동수단·로그인·PIN·알림","localStorage · 계정 병합 없음"] },
];
const N = Object.fromEntries(nodes.map(n => [n.id, n]));
for (const n of nodes) {
  n.cy = n.cy || cyOf(n.lane);
  if (n.type === "proc") { n.w = n.w || 150; n.h = n.h || 64; }
  else if (n.type === "dec") { n.w = 130; n.h = 92; }
  else { n.w = n.w || 76; n.h = 32; }
}
function port(n, side, off) {
  off = off || 0;
  if (side === "l") return [n.x - n.w/2, n.cy + off];
  if (side === "r") return [n.x + n.w/2, n.cy + off];
  if (side === "t") return [n.x + off, n.cy - n.h/2];
  return [n.x + off, n.cy + n.h/2];
}

/* pts: 중간 경유점(꺾임) · lab: Yes/No 상자 라벨 · foff/toff: 포트 위치 보정 */
const edges = [
  { f:"st1",fs:"r", t:"create",ts:"l" },
  { f:"home",fs:"t", t:"create",ts:"b", dash:1, lab:"미배정 핑 이관", lx:330, ly:214 },
  { f:"create",fs:"r", t:"share",ts:"l" },
  { f:"share",fs:"b", t:"enter",ts:"t" },
  { f:"enter",fs:"r", t:"form",ts:"l" },
  { f:"form",fs:"b", t:"dDup",ts:"t" },
  { f:"dDup",fs:"b", t:"popup",ts:"b", toff:28, pts:[[670,558],[868,558],[868,343]], lab:"중복", lx:770, ly:558 },
  { f:"popup",fs:"l", t:"form",ts:"r" },
  { f:"dDup",fs:"r", t:"dCap",ts:"l", lab:"고유", lx:820, ly:495 },
  { f:"dCap",fs:"t", t:"reject",ts:"b", toff:-30, lab:"초과", lx:1002, ly:406 },
  { f:"reject",fs:"t", foff:-30, t:"endR",ts:"b", toff:-30 },
  { f:"dCap",fs:"r", t:"ping",ts:"l", pts:[[1085,495],[1085,325]], lab:"여유", lx:1060, ly:495 },
  { f:"ping",fs:"b", t:"snap",ts:"t" },
  { f:"snap",fs:"r", t:"lock",ts:"b", pts:[[1280,495],[1280,228],[1550,228]] },
  { f:"aiBtn",fs:"b", t:"aiRun",ts:"t", dash:1 },
  { f:"aiRun",fs:"l", t:"snap",ts:"b", toff:40, pts:[[1230,655],[1230,527]], dash:1, lab:"후보 공급", lx:1230, ly:600 },
  { f:"lock",fs:"b", t:"dCnt",ts:"t" },
  { f:"dCnt",fs:"r", t:"vote",ts:"l", pts:[[1635,495],[1635,325]], lab:"2개 이상", lx:1635, ly:452 },
  { f:"dCnt",fs:"b", t:"confirm",ts:"b", toff:30, pts:[[1550,562],[2220,562],[2220,222],[2150,222]], lab:"1개 — 투표 생략", lx:1830, ly:562 },
  { f:"vote",fs:"b", t:"prog",ts:"t" },
  { f:"prog",fs:"r", t:"dTie",ts:"l" },
  { f:"dTie",fs:"t", t:"tie",ts:"b", lab:"동점", lx:1946, ly:406 },
  { f:"tie",fs:"l", t:"vote",ts:"t", pts:[[1740,155]], dash:1, lab:"재투표", lx:1795, ly:155 },
  { f:"tie",fs:"r", t:"confirm",ts:"l", lab:"재량", lx:2025, ly:138 },
  { f:"dTie",fs:"r", t:"confirm",ts:"b", toff:-30, pts:[[2020,495],[2020,228],[2090,228]], lab:"최다득표", lx:2020, ly:452 },
  { f:"confirm",fs:"b", t:"dScope",ts:"t" },
  { f:"dScope",fs:"r", t:"radius",ts:"l", lab:"지점", lx:2205, ly:478 },
  { f:"dScope",fs:"b", t:"route",ts:"b", pts:[[2120,762],[3080,762]], lab:"지역까지 — 지점 단계 건너뜀", lx:2600, ly:762 },
  { f:"radius",fs:"t", t:"poi",ts:"b", foff:-20, toff:-20 },
  { f:"poi",fs:"r", t:"dPoi",ts:"l", pts:[[2420,325],[2420,495]] },
  { f:"dPoi",fs:"t", t:"reg",ts:"b", lab:"있음", lx:2528, ly:406 },
  { f:"aiBtn2",fs:"b", t:"aiRun2",ts:"t", dash:1 },
  { f:"aiRun2",fs:"l", t:"reg",ts:"r", toff:15, pts:[[2605,655],[2605,340]], dash:1, lab:"후보 공급", lx:2605, ly:600 },
  { f:"reg",fs:"t", t:"lock2",ts:"b", pts:[[2510,225],[2890,225]] },
  { f:"lock2",fs:"b", t:"vote2",ts:"t" },
  { f:"vote2",fs:"r", t:"confirm2",ts:"b", toff:-40, pts:[[2985,325],[2985,222],[3040,222]] },
  { f:"confirm2",fs:"b", foff:20, t:"route",ts:"t", toff:20 },
  { f:"route",fs:"r", t:"light",ts:"l", pts:[[3175,495],[3175,325]] },
  { f:"light",fs:"t", t:"kakaoLink",ts:"b" },
  { f:"kakaoLink",fs:"r", t:"endF",ts:"l", lab:"다음날", lx:3375, ly:138 },
  { f:"kakaoLink",fs:"l", t:"lock2",ts:"t", toff:10, pts:[[3175,155],[3175,100],[2900,100]], dash:1, lab:"reopen 사다리 — 확정→투표→후보 (표 유지)", lx:3040, ly:100 },
];

/* ── 렌더 ── */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let out = "";

/* 제목 */
out += `<text x="20" y="30" font-size="21" font-weight="700" fill="#212B36">모이머 모임생성결과 프로세스 분산 순서도 — 역할 스윔레인</text>`;
out += `<text x="20" y="52" font-size="12" fill="#5D6670">「모이머 전체 화면 순서도 — 설계 확정판」 v19 기준 (2026-08-07) · 행 = 역할 · 마름모 = 분기 · 점선 = 선택(AI)·복귀·오류 · 주황 = 시작 · 남색 = 종료</text>`;

/* 레인 배경 + 라벨 */
for (const l of lanes) {
  out += `<rect x="8" y="${l.y}" width="${W-16}" height="${l.h}" fill="${l.c}"/>`;
  out += `<line x1="8" y1="${l.y}" x2="${W-8}" y2="${l.y}" stroke="#fff" stroke-width="2"/>`;
  const cy = l.y + l.h/2;
  out += `<rect x="18" y="${cy-23}" width="136" height="46" rx="4" fill="#fff" stroke="#D64545" stroke-width="2"/>`;
  out += `<text x="86" y="${cy-2}" text-anchor="middle" font-size="14" font-weight="700" fill="#212B36">${esc(l.label)}</text>`;
  out += `<text x="86" y="${cy+14}" text-anchor="middle" font-size="8.5" fill="#5D6670">${esc(l.sub)}</text>`;
}

/* 간선 (노드보다 먼저) */
let labels = "";
for (const e of edges) {
  const p1 = port(N[e.f], e.fs, e.foff), p2 = port(N[e.t], e.ts, e.toff);
  const pts = [p1, ...(e.pts || []), p2];
  const d = "M" + pts.map(p => p.join(",")).join(" L");
  out += `<path d="${d}" fill="none" stroke="#5B6472" stroke-width="1.7" ${e.dash?'stroke-dasharray="6 4" stroke-opacity=".75"':""} marker-end="url(#arw)"/>`;
  if (e.lab) {
    const w = e.lab.length * 9.4 + 12;
    labels += `<rect x="${e.lx-w/2}" y="${e.ly-10}" width="${w}" height="19" rx="3" fill="#fff" stroke="#98A2B3" stroke-width="1"/>`;
    labels += `<text x="${e.lx}" y="${e.ly+4}" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">${esc(e.lab)}</text>`;
  }
}
out += labels;

/* 노드 */
for (const n of nodes) {
  const x = n.x, cy = n.cy, w = n.w, h = n.h;
  if (n.type === "start") {
    out += `<rect x="${x-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#E8944A" stroke="#C77A35" stroke-width="1.6"/>`;
    out += `<text x="${x}" y="${cy+5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${esc(n.t[0])}</text>`;
  } else if (n.type === "end") {
    out += `<rect x="${x-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#3F5E9E" stroke="#31497C" stroke-width="1.6"/>`;
    out += `<text x="${x}" y="${cy+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${esc(n.t[0])}</text>`;
  } else if (n.type === "dec") {
    out += `<path d="M${x},${cy-h/2} L${x+w/2},${cy} L${x},${cy+h/2} L${x-w/2},${cy} Z" fill="#CFE0F2" stroke="#7D9CC4" stroke-width="1.6"/>`;
    if (n.t.length === 1)
      out += `<text x="${x}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#243B55">${esc(n.t[0])}</text>`;
    else {
      out += `<text x="${x}" y="${cy-3}" text-anchor="middle" font-size="11" font-weight="700" fill="#243B55">${esc(n.t[0])}</text>`;
      out += `<text x="${x}" y="${cy+12}" text-anchor="middle" font-size="11" font-weight="700" fill="#243B55">${esc(n.t[1])}</text>`;
    }
  } else {
    const fill = n.dash ? (n.lane === "ai" ? "#EFE9FB" : "#FFFDF0") : "#FDF6C9";
    const stroke = n.dash ? (n.lane === "ai" ? "#8C7BC9" : "#B0A25E") : "#B8A94A";
    out += `<rect x="${x-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${n.dash?'stroke-dasharray="6 4"':""}/>`;
    if (n.t.length === 1)
      out += `<text x="${x}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3A20">${esc(n.t[0])}</text>`;
    else if (n.t.length === 2) {
      out += `<text x="${x}" y="${cy-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3A20">${esc(n.t[0])}</text>`;
      out += `<text x="${x}" y="${cy+13}" text-anchor="middle" font-size="9.3" fill="#6B6A4E">${esc(n.t[1])}</text>`;
    } else {
      out += `<text x="${x}" y="${cy-14}" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3A20">${esc(n.t[0])}</text>`;
      out += `<text x="${x}" y="${cy+4}" text-anchor="middle" font-size="9.3" fill="#6B6A4E">${esc(n.t[1])}</text>`;
      out += `<text x="${x}" y="${cy+20}" text-anchor="middle" font-size="9.3" fill="#6B6A4E">${esc(n.t[2])}</text>`;
    }
  }
}

/* dPoi 0개 스텁 */
out += `<path d="M2510,541 L2510,562" fill="none" stroke="#5B6472" stroke-width="1.7" stroke-dasharray="6 4" stroke-opacity=".75" marker-end="url(#arw)"/>`;
out += `<rect x="2345" y="562" width="250" height="19" rx="3" fill="#fff" stroke="#98A2B3"/>`;
out += `<text x="2470" y="576" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">0개 — 확장(700→1400m 1회) 또는 다른 수단</text>`;

/* ── 줌·팬 ── */
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
let k = 1, tx = 0, ty = 0;
function apply(){ world.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`); }
function fit(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  k = Math.min(vw / W, vh / H) * 0.97;
  tx = (vw - W * k) / 2; ty = (vh - H * k) / 2;
  apply();
}
function zoomAt(cx, cy, f){
  const nk = Math.min(6, Math.max(0.1, k * f));
  const r = nk / k;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk;
  apply();
}
wrap.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18); }, { passive:false });
let dragging = false, lx = 0, ly = 0;
wrap.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
wrap.addEventListener("pointerup", () => { dragging = false; wrap.classList.remove("drag"); });
wrap.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 1.6));
document.getElementById("zi").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.3);
document.getElementById("zo").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.3);
document.getElementById("zr").onclick = fit;
window.addEventListener("resize", fit);
if (new URLSearchParams(location.search).get("shot")) document.documentElement.classList.add("shot");
fit();
