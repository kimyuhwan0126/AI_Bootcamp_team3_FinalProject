<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모이머 기능 순서도</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F4F6FA;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #wrap{position:fixed;inset:0;cursor:grab;touch-action:none}
  #wrap.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;user-select:none}
  .ctrl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .ctrl button{width:42px;height:42px;font-size:19px;border:1px solid #C9CFDA;background:#fff;border-radius:9px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.10);color:#41556F}
  .ctrl button:hover{background:#EAF0FC}
  .hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:#5D6670;background:#ffffffcc;padding:6px 12px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div id="wrap"><svg id="svg"><g id="world"></g></svg></div>
<div class="ctrl">
  <button id="zi" title="확대">＋</button>
  <button id="zo" title="축소">－</button>
  <button id="zr" title="전체 보기">⟳</button>
</div>
<div class="hint">🖱 휠 = 확대/축소 &nbsp;·&nbsp; 드래그 = 이동 &nbsp;·&nbsp; 더블클릭 = 확대 &nbsp;·&nbsp; ⟳ = 전체 보기</div>
<script>
"use strict";
/* ── 데이터: 카드 = 기능 한 단계. s=화면, v=서버·도메인, e=저장·외부, p=AI ── */
const CW = 350, CH = 152;
const C = {
  screen: "#2451B3", server: "#0F6E56", ext: "#993C1D", ai: "#534AB7",
  cardBg: "#FFFFFF", cardBr: "#C9CFDA", aiBg: "#F6F5FE",
  band: ["#EEF3FB", "#EAF6F0", "#FBF1EA"], gray: "#5D6670", dark: "#212B36", gold: "#B08A2E"
};
const cards = [
  { id:"a1", x:90,  y:190, num:"①", title:"모임 생성",
    lines:[["s","방장 카카오 로그인 · 출발지·시간·범위·카테고리 원스텝"],
           ["v","{create} → createMeeting() — 6자 참여코드 발급"],
           ["v","stage: main · aiPhase: region · meetTime 은 여기서"],
           ["e","Neon meetings 행 · DB 없으면 인메모리 폴백"]] },
  { id:"a2", x:520, y:190, num:"②", title:"링크 공유 → 참여",
    lines:[["s","/m/{code} · 이름·출발지·PIN(비로그인) 원스텝 · 최대 8명"],
           ["v","{join} → joinMeeting() · participantId 쿠키 세션"],
           ["v","1.8초 폴링으로 전원 화면 동기화"],
           ["e","Neon participants 행 · 표와 분리(동시쓰기 보호)"]] },
  { id:"a3", x:950, y:190, num:"③", title:"출발지 입력 — 폼 원스텝 내",
    lines:[["s","자동완성으로 장소 선택 · 대중교통 / 자차"],
           ["v","{origin} — 자동완성 좌표 그대로 저장 (동명 방지)"],
           ["v","텍스트만 오면 resolveGeocode() 폴백"],
           ["e","카카오 로컬 검색 · 키 없으면 HUBS mock"]] },
  { id:"b1", x:950, y:470, num:"④", title:"지역 후보 등록 (핑)",
    lines:[["s","지도 전체화면 — 누구나 핑 찍어 후보 등록"],
           ["v","{addRegion} — 동 스냅 · 같은 동 병합 · 인원당 1개"],
           ["v","이동시간 미표시 — 경로 API 는 확정 후에만"],
           ["e","카카오 coord2regioncode · 실패 시 좌표 폴백"]] },
  { id:"b2", x:520, y:470, num:"⑤", title:"지역 투표",
    lines:[["s","지도 핀 탭 → 표 증가 · 재탭으로 변경"],
           ["v","{vote} → castVote() — 1인 1표 · 서버는 집계만"],
           ["v","표는 별도 행에만 — 모임 행에 담으면 사라진다"],
           ["e","Neon votes 행 · DB 모드 인메모리 캐시 없음"]] },
  { id:"b3", x:90,  y:470, num:"⑥", title:"지역 확정 → 분기",
    lines:[["s","방장 확정 (최다득표 · 동점은 재량 또는 재투표)"],
           ["v","{confirmManual} → confirmRegion()"],
           ["v","확정 범위 '지역까지'면 stage → result 직행"],
           ["v","'지점까지'면 aiPhase place — 확정 핀 중심 700m"]] },
  { id:"ai", x:950, y:690, num:"🤖", title:"(선택) AI 추천 — 방장 버튼", dashed:true,
    lines:[["p","후보 등록 단계에서 방장만 · 재호출 무제한 · 미호출 0원"],
           ["p","ECO 원콜 (지역 ~25초 · 풀코스 ~55초) · 실패 시 표준"],
           ["p","GLM 5.2 (Ollama Cloud) — 7,400여 콜 실측 $0"],
           ["p","3곳 공급 · 중복 동은 병합+AI태그 · 실패 시 토스트"]] },
  { id:"c1", x:90,  y:952, num:"⑦", title:"지점 후보 · 투표 → 확정",
    lines:[["s","전원: 카테고리·검색 POI → 탭 등록 (상한 없음·삭제권)"],
           ["p","방장 · AI 지점 추천 (선택) — ECO ~9초"],
           ["v","{startVote} 잠금 → {vote} 집계 → confirmPlace()"],
           ["e","Neon — winnerRegionId·winnerPlaceId"]] },
  { id:"d1", x:520, y:952, num:"⑧", title:"결과 화면",
    lines:[["s","확정 결과 — 여기서만 내 경로·소요·요금 표시"],
           ["v","route-path·route-detail · 지점 카카오 링크(결제 아님)"],
           ["v","{status} 노랑=지각(분 입력 공유) · 빨강=불참"],
           ["e","ODsay loadLane·TMAP geometry · 근사면 real:false"]] },
];
const byId = Object.fromEntries(cards.map(c => [c.id, c]));

/* ── 밴드(기능 그룹) ── */
const bands = [
  { x:50, y:120,  w:1300, h:250, label:"STEP 1 · 모임 준비", color:C.band[0], tc:"#2451B3" },
  { x:50, y:400,  w:1300, h:470, label:"STEP 2 · 지역 결정 — 핑 후보 + 투표 (1차)", color:C.band[1], tc:"#0F6E56" },
  { x:50, y:900,  w:1300, h:240, label:"STEP 3 · 지점 결정 → 결과 (2차)", color:C.band[2], tc:"#993C1D" },
];

/* ── 화살표: [fromId, fromSide, toId, toSide, label?, style?] ── */
const edges = [
  ["a1","r","a2","l"], ["a2","r","a3","l"],
  ["a3","b","b1","t"],                                  // 준비 → 지역 후보 (같은 x라 수직)
  ["b1","l","b2","r"], ["b2","l","b3","r"],             // 지역 행은 우→좌 (S자 흐름)
  ["b1","b","ai","t","호출 ↔ 후보 3곳 · 같은 동 병합", "ai"],  // 후보 등록 단계에서만 · 방장 버튼
  ["b3","b","c1","t"],                                  // 지역 확정 → 지점 (수직)
  ["c1","r","d1","l"],                                  // 지점 확정 → 결과
];

function pt(card, side){
  const {x,y} = card;
  if (side==="l") return [x, y+CH/2];
  if (side==="r") return [x+CW, y+CH/2];
  if (side==="t") return [x+CW/2, y];
  return [x+CW/2, y+CH];
}
function path(p1, p2, s1, s2){
  const [x1,y1]=p1,[x2,y2]=p2;
  const h = (s)=> s==="l"||s==="r";
  const d = 0.5*Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
  const c1 = h(s1) ? [x1+(s1==="r"?d:-d), y1] : [x1, y1+(s1==="b"?d:-d)];
  const c2 = h(s2) ? [x2+(s2==="r"?d:-d), y2] : [x2, y2+(s2==="t"?-d:d)];
  return `M${x1},${y1} C${c1},${c2},${x2},${y2}`;
}
const esc = (s)=> s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let svgStr = "";
/* 제목 */
svgStr += `<text x="700" y="52" font-size="24" font-weight="700" fill="${C.dark}" text-anchor="middle">모이머(Moimer) 기능 순서도</text>`;
svgStr += `<text x="700" y="80" font-size="13" fill="${C.gray}" text-anchor="middle">화면 → API → 도메인 → 저장·외부 연동 · 데이터·API 관점 v19 (2026-08-07) · 보라 점선 = 선택(AI) · 금색 점선 = 되돌리기 · 자세한 규칙: 「모이머 전체 화면 순서도 — 설계 확정판」</text>`;
/* 밴드 */
for (const b of bands){
  svgStr += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="14" fill="${b.color}"/>`;
  svgStr += `<text x="${b.x+18}" y="${b.y+30}" font-size="14.5" font-weight="700" fill="${b.tc}">${esc(b.label)}</text>`;
}
/* 화살표 (카드보다 아래에 깔리도록 먼저) */
for (const [f,fs,t,ts,label,style] of edges){
  const p1 = pt(byId[f],fs), p2 = pt(byId[t],ts);
  const isAi = style==="ai";
  svgStr += `<path d="${path(p1,p2,fs,ts)}" fill="none" stroke="${isAi?C.ai:"#8A93A2"}" stroke-width="2.2" ${isAi?'stroke-dasharray="7 5"':""} marker-end="url(#${isAi?"ma":"m"})"/>`;
  if (label){
    const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
    svgStr += `<text x="${mx+12}" y="${my+4}" font-size="11" fill="${C.ai}">${esc(label)}</text>`;
  }
}
/* 되돌리기 루프: 결과 → 지역 투표 (금색 점선, 왼쪽 외곽) */
{
  // 결과(⑧) 아래로 나가 왼쪽 외곽을 타고 올라와 지역 투표(⑤) 위로 들어간다 — 카드 아래·위 회랑을 지난다
  const d1 = byId.d1, b2 = byId.b2;
  const sx = d1.x+CW/2, sy = d1.y+CH, ex = b2.x+CW/2, ey = b2.y;
  svgStr += `<path d="M${sx},${sy} C${sx},${sy+36} 24,${sy+36} 24,${sy-14} L24,470 C24,446 ${ex},446 ${ex},${ey-4}" fill="none" stroke="${C.gold}" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#mg)"/>`;
  svgStr += `<text x="14" y="780" font-size="11.5" fill="${C.gold}" transform="rotate(-90 14 780)" text-anchor="middle">{reopen} 사다리 — 확정→투표→후보 한 칸씩</text>`;
}
/* 카드 */
for (const c of cards){
  const br = c.dashed ? C.ai : C.cardBr;
  const bg = c.dashed ? C.aiBg : C.cardBg;
  svgStr += `<g>`;
  svgStr += `<rect x="${c.x}" y="${c.y}" width="${CW}" height="${CH}" rx="10" fill="${bg}" stroke="${br}" stroke-width="1.6" ${c.dashed?'stroke-dasharray="7 4"':""} filter="url(#sh)"/>`;
  svgStr += `<text x="${c.x+16}" y="${c.y+28}" font-size="15" font-weight="700" fill="${c.dashed?C.ai:C.dark}">${esc(c.num+" "+c.title)}</text>`;
  let ly = c.y + 52;
  for (const [kind,txt] of c.lines){
    const col = kind==="s"?C.screen : kind==="v"?C.server : kind==="e"?C.ext : C.ai;
    svgStr += `<rect x="${c.x+16}" y="${ly-8}" width="8" height="8" rx="2" fill="${col}"/>`;
    svgStr += `<text x="${c.x+31}" y="${ly}" font-size="11.6" fill="${col}">${esc(txt)}</text>`;
    ly += 24;
  }
  svgStr += `</g>`;
}
/* 범례 + 설계 원칙 */
svgStr += `<g>
  <rect x="1010" y="952" width="290" height="152" rx="10" fill="#FAF9F5" stroke="#E3E0D8"/>
  <text x="1028" y="979" font-size="13" font-weight="700" fill="${C.dark}">범례</text>
  <rect x="1028" y="994" width="9" height="9" rx="2" fill="${C.screen}"/><text x="1044" y="1003" font-size="11.5" fill="${C.gray}">화면 (사용자가 보고 누르는 것)</text>
  <rect x="1028" y="1018" width="9" height="9" rx="2" fill="${C.server}"/><text x="1044" y="1027" font-size="11.5" fill="${C.gray}">서버·도메인 (app/api → lib/)</text>
  <rect x="1028" y="1042" width="9" height="9" rx="2" fill="${C.ext}"/><text x="1044" y="1051" font-size="11.5" fill="${C.gray}">저장(Neon) · 외부 API</text>
  <rect x="1028" y="1066" width="9" height="9" rx="2" fill="${C.ai}"/><text x="1044" y="1075" font-size="11.5" fill="${C.gray}">AI (방장 opt-in · GLM 5.2)</text>
</g>`;
svgStr += `<g>
  <rect x="50" y="1164" width="1300" height="108" rx="12" fill="#FAF9F5" stroke="#E3E0D8"/>
  <text x="700" y="1192" font-size="13.5" font-weight="700" fill="${C.dark}" text-anchor="middle">설계 원칙 — 어기면 실제로 겪은 사고가 재현된다</text>
  <text x="76" y="1218" font-size="12" fill="${C.gray}">① 외부 API 는 전부 mock 폴백 — 키가 하나도 없어도 npm run dev 만으로 전체 플로우가 돈다 (실 API 성공값만 캐시)</text>
  <text x="76" y="1240" font-size="12" fill="${C.gray}">② 화면은 lib/store 를 직접 부르지 않는다 — 항상 /api/meeting 경유 · 쓰기 단위 분리(모임/참가자/표)</text>
  <text x="76" y="1262" font-size="12" fill="${C.gray}">③ 가짜를 실제처럼 그리지 않는다(real:false) · 만드는 중인 기능은 .env.local 의 NEXT_PUBLIC_FF_* 플래그 뒤에 둔다</text>
</g>`;

/* ── 렌더 ── */
const W = 1400, H = 1300;
const world = document.getElementById("world");
world.innerHTML = `
<defs>
  <marker id="m"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A2"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.ai}"/></marker>
  <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.gold}"/></marker>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1A2433" flood-opacity="0.10"/></filter>
</defs>` + svgStr;

/* ── 줌·팬 ── */
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
let k = 1, tx = 0, ty = 0;
function apply(){ world.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`); }
function fit(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  k = Math.min(vw / W, vh / H) * 0.96;
  tx = (vw - W * k) / 2; ty = (vh - H * k) / 2;
  apply();
}
function zoomAt(cx, cy, f){
  const nk = Math.min(6, Math.max(0.15, k * f));
  const r = nk / k;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk;
  apply();
}
wrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18);
}, { passive:false });
let dragging = false, lx = 0, ly = 0;
wrap.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", (e) => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
wrap.addEventListener("pointerup",   () => { dragging = false; wrap.classList.remove("drag"); });
wrap.addEventListener("dblclick", (e) => zoomAt(e.clientX, e.clientY, 1.6));
document.getElementById("zi").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.3);
document.getElementById("zo").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.3);
document.getElementById("zr").onclick = fit;
window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
