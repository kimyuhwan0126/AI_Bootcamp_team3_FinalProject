<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모이머 전체 화면 UI/UX 순서도</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F4F6FA;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #wrap{position:fixed;inset:0;cursor:grab;touch-action:none}
  #wrap.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;user-select:none}
  .ctrl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .ctrl button{width:42px;height:42px;font-size:19px;border:1px solid #C9CFDA;background:#fff;border-radius:9px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.10);color:#41556F}
  .ctrl button:hover{background:#EAF0FC}
  .hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:#5D6670;background:#ffffffcc;padding:6px 12px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .shot .ctrl,.shot .hint{display:none}
</style>
</head>
<body>
<div id="wrap"><svg id="svg"><g id="world"></g></svg></div>
<div class="ctrl">
  <button id="zi" title="확대">＋</button>
  <button id="zo" title="축소">－</button>
  <button id="zr" title="전체 보기">⟳</button>
</div>
<div class="hint">🖱 휠 = 확대/축소 · 드래그 = 이동 · 더블클릭 = 확대 · ⟳ = 전체 보기</div>
<script>
"use strict";
/* ── 모이머 전체 화면 UI/UX 순서도 — 화면 내비게이션 맵 ──
   설계 확정판 v19. 모든 화면 11대 + 팝업·외부 연결.
   화살표 라벨 = 그 화면에서 누르는 [버튼]. 점선 = 조건부·외부·복귀. */
const W = 2620, H = 1500;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let out = "";

const C = {
  brand:"#2F6BFF", green:"#2E7D32", orange:"#E8944A", ai:"#6C5CE7",
  kakao:"#FDD835", danger:"#E11D48", ink:"#22252B", sub:"#6B7280",
  map:"#E9F0E7", road:"#FFFFFF", line:"#D8DEE8",
  p1:"#E8574B", p2:"#2F80ED", p3:"#F2994A", gray:"#9AA3AF"
};

function R(x,y,w,h,r,fill,stroke,sw,dash){
  out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"`
       + (stroke?` stroke="${stroke}" stroke-width="${sw||1}"`:"")
       + (dash?` stroke-dasharray="${dash}"`:"") + `/>`;
}
function T(x,y,s,size,fill,w,anchor){
  out += `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}"`
       + (w?` font-weight="${w}"`:"") + (anchor?` text-anchor="${anchor}"`:"") + `>${esc(s)}</text>`;
}
function pin(x,y,color,rr){
  rr = rr || 6;
  out += `<path d="M${x},${y} L${x-rr*0.75},${y-rr} A${rr},${rr} 0 1 1 ${x+rr*0.75},${y-rr} Z" fill="${color}"/>`;
  out += `<circle cx="${x}" cy="${y-rr-1.5}" r="${rr*0.42}" fill="#fff"/>`;
}
function badge(cx,cy,txt,fill,tc,dash){
  const w = txt.length*8.2+12;
  R(cx-w/2,cy-8,w,16,8,fill,dash?tc:null,1,dash?"3 2":null);
  T(cx,cy+3.5,txt,8.5,tc,700,"middle");
}
function btn(x,y,w,h,txt,fill,tc,dash,stroke){
  R(x,y,w,h,h/2*0.6,fill,stroke||null,1.2,dash?"4 3":null);
  T(x+w/2,y+h/2+3.5,txt,9,tc,700,"middle");
}
function input(x,y,w,label,val){
  R(x,y,w,20,5,"#F3F5F9","#D8DEE8",1);
  T(x+7,y+13.5,label,8.5,val?"#22252B":"#98A2B3",val?600:400);
}
function mapBg(ox,oy,w,h){
  R(ox,oy,w,h,0,C.map);
  out += `<path d="M${ox},${oy+h*0.3} L${ox+w},${oy+h*0.22} M${ox+w*0.35},${oy} L${ox+w*0.42},${oy+h} M${ox},${oy+h*0.72} L${ox+w},${oy+h*0.66}" stroke="${C.road}" stroke-width="5" fill="none"/>`;
}
function tabbar(ox,oy,active){
  R(ox,oy,184,30,0,"#FFFFFF","#E3E7EF",1);
  ["홈","모임","내정보"].forEach((t,i)=>{
    T(ox+31+i*61,oy+19,t,8.5,i===active?C.brand:"#98A2B3",i===active?700:400,"middle");
  });
}
function progress(ox,oy,txt,ratio){
  R(ox+8,oy,168,18,9,"#FFFFFF","#D8DEE8",1);
  R(ox+13,oy+5,60,8,4,"none","#D8DEE8",1);
  R(ox+13,oy+5,60*(ratio==null?1:ratio),8,4,C.brand);
  T(ox+80,oy+12.5,txt,7.2,"#374151",600);
}
function phone(cx, top, title, badgeTxt, badgeColor){
  R(cx-100, top, 200, 400, 30, "#23252B");
  R(cx-92,  top+8, 184, 384, 22, "#FFFFFF");
  R(cx-28,  top+8, 56, 9, 4.5, "#23252B");
  T(cx, top-24, title, 14, "#22252B", 700, "middle");
  const w = badgeTxt.length*10+16;
  R(cx-w/2, top-16, w, 15, 7.5, badgeColor);
  T(cx, top-4.5, badgeTxt, 8.5, "#fff", 700, "middle");
  return [cx-92, top+8];
}
/* 팝업 목록 카드 — [버튼] 동작 리스트 */
function pcard(cx, y, title, rows){
  const w = 276, h = 32 + rows.length*20;
  R(cx-w/2, y, w, h, 10, "#FFFFFF", "#98A2B3", 1.3, "5 4");
  T(cx, y+19, title, 10.5, "#22252B", 700, "middle");
  rows.forEach((r,i)=>{
    const m = r.match(/^(\[[^\]]+\])\s*(.*)$/);
    T(cx-w/2+12, y+38+i*20, m?m[1]:"", 8.5, C.brand, 700);
    T(cx-w/2+12+(m?m[1].length*8.2+6:0), y+38+i*20, m?m[2]:r, 8.5, "#4B5563");
  });
  return h;
}
/* 화살표 + [버튼] 라벨 상자 — 라벨은 별도 버퍼에 모아 폰·카드 위에 마지막으로 그린다 */
let outLab = "";
function arrow(pts, lab, lx, ly, dash, color){
  const d = "M" + pts.map(p=>p.join(",")).join(" L");
  out += `<path d="${d}" fill="none" stroke="${color||"#5B6472"}" stroke-width="2" ${dash?'stroke-dasharray="6 4"':""} marker-end="url(#arw${color?"g":""})"/>`;
  if (lab){
    const w = lab.length*9.2+14;
    const save = out; out = "";
    R(lx-w/2, ly-10, w, 20, 10, "#fff", color||"#98A2B3", 1.1);
    T(lx, ly+4, lab, 10, color?C.green:"#374151", 700, "middle");
    outLab += out; out = save;
  }
}

/* ══════════ 제목 ══════════ */
T(20, 34, "모이머 전체 화면 UI/UX 순서도 — 화면 내비게이션 맵", 22, "#22252B", 700);
T(20, 56, "설계 확정판 v19 (2026-08-07) · 화면 11대 + 팝업·외부 연결 전수 · 화살표 라벨 = 그 화면에서 누르는 [버튼] · 점선 = 조건부·외부·복귀 · 각 화면의 세부 규칙은 「모이머 전체 화면 순서도 — 설계 확정판」 참조", 12, "#5D6670");

const TT = 140, FT = 700;                       // 탭 밴드 · 흐름 밴드 폰 상단
const Cx = [260, 560, 860, 1160, 1460, 1760, 2060, 2360];
T(20, 106, "▌ 하단 탭 화면", 13, "#41556F", 700);

T(20, 1198, "▌ 각 화면의 팝업·연결 (점선 스텁 = 그 화면에서 뜸)", 13, "#41556F", 700);

arrow([[Cx[0]+102,340],[Cx[1]-104,340]], "하단 탭", (Cx[0]+Cx[1])/2, 318, 1);
arrow([[Cx[1]-104,352],[Cx[0]+102,352]], null, 0, 0, 1);
arrow([[Cx[1]+102,340],[Cx[2]-104,340]], null, 0, 0, 1);
arrow([[Cx[2]-104,352],[Cx[1]+102,352]], "하단 탭", (Cx[1]+Cx[2])/2, 318, 1);

arrow([[Cx[0],542],[Cx[0],654]], "[이 출발지들로 모임 만들기] 로그인 필수", Cx[0]+96, 576);

/* 참여 → 핑 등록 */
arrow([[Cx[1]+102,900],[Cx[2]-107,900]], "[참여하기]", (Cx[1]+Cx[2])/2, 878);

arrow([[Cx[2]+102,900],[Cx[3]-107,900]], "[투표 시작] 핑 잠금", (Cx[2]+Cx[3])/2, 878);
/* 지역 투표 → 지점 등록 */
arrow([[Cx[3]+102,900],[Cx[4]-107,900]], "[지역 확정] '지점까지'", (Cx[3]+Cx[4])/2, 878);
/* 지역 투표 → 결과 ('지역까지' 건너뜀, 측면 진출입 위 레일) */
arrow([[Cx[3]+102,730],[1310,730],[1310,622],[1910,622],[1910,730],[Cx[6]-104,730]], "[지역 확정] '지역까지' — 경로 없이 지도만", 1610, 622, 1, C.green);
/* 지점 등록 → 지점 투표 */
arrow([[Cx[4]+102,900],[Cx[5]-107,900]], "[투표 시작] 후보 잠금", (Cx[4]+Cx[5])/2, 878);
/* 지점 투표 → 결과 */
arrow([[Cx[5]+102,900],[Cx[6]-107,900]], "[지점 확정] 경로 API", (Cx[5]+Cx[6])/2, 878);
/* 결과 → 지난 모임 */
arrow([[Cx[6]+102,900],[Cx[7]-107,900]], "모임일 다음날 (자동)", (Cx[6]+Cx[7])/2, 878, 1);
/* 되돌리기 · 승격 (아래 레일) */
arrow([[Cx[6]-45,1102],[Cx[6]-45,1160],[Cx[5]+45,1160],[Cx[5]+45,1104]], "[되돌리기] reopen 사다리", 1890, 1160, 1);
arrow([[Cx[6]-75,1102],[Cx[6]-75,1180],[Cx[4]+75,1180],[Cx[4]+75,1104]], "[지점도 정하기] 승격 ('지역까지' 모임)", 1690, 1180, 1);
/* 지난 모임 → 생성 (재모임, 맨 아래 레일) */
arrow([[Cx[7],1102],[Cx[7],1424],[Cx[0],1424],[Cx[0],1104]], "[이 멤버로 재모임 만들기] — 생성 폼 프리필 (로그인 멤버 자동)", 1310, 1424, 1, C.green);
/* 팝업 스텁 (점선 수직) */
for (const i of [1,2,3,4,6]) {
  out += `<path d="M${Cx[i]},1102 L${Cx[i]},1216" stroke="#98A2B3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwd)"/>`;
}
/* 홈·공통 팝업 카드 연결 */
out += `<path d="M${Cx[2]+102},300 L${Cx[3]-140},300" stroke="#98A2B3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwd)"/>`;

/* ══════════ 팝업 목록 카드 ══════════ */
pcard(Cx[3], 236, "홈 · 공통 팝업", [
  "[POI 핀 탭] 장소 상세 바텀시트 (탐색 모드)",
  "[모임 만들기 · 비로그인] 카카오 로그인 유도",
  "[하단 탭] 홈·모임·내정보 — 모든 화면 상시",
  "[초대 링크 클릭] 카카오톡 → ⑤ 참여 폼 진입",
]);
pcard(Cx[1], 1220, "⑤ 참여 팝업", [
  "[이름 중복] 별칭 입력 또는 PIN으로 복구",
  "[PIN 5회 실패] 잠금 — 방장 강퇴→재참여만",
  "[9번째 입장] 거부 — 유료 구간 구상",
]);
pcard(Cx[2], 1220, "⑥ AI 팝업 (방장 전용)", [
  "[AI 추천] 로딩 ~25초 — 방장 화면에만",
  "[AI 실패] 토스트 — 재시도 or 수동 진행",
  "[AI 재호출] 이전 후보 교체 vs 추가 선택",
  "[AI 중 투표 시작] AI 취소 확인 팝업",
  "[투표 시작] 0개=불가 토스트 · 1개=투표 생략",
]);
pcard(Cx[3], 1220, "⑦ 투표 팝업 (방장)", [
  "[지역 확정 · 동점] 재량 선택 or 재투표",
  "[재투표] 횟수 무제한 · 표 유지",
]);
pcard(Cx[4], 1220, "⑧ 조회 팝업 (전원)", [
  "[POI 0개] 반경 확장(700→1400 · 1회 · 전체)",
  "[확장에도 0개] 다른 카테고리·검색·AI 유도",
]);
pcard(Cx[6], 1220, "⑩ 결과 팝업 · 외부 연결", [
  "[신호등 노랑] 몇 분 지각? 입력 — 당일만",
  "[지점 카카오 링크] 카카오맵 상세 (외부)",
  "[카톡 알리기] 공유 시트 (외부 · 상시 버튼)",
  "[모임 삭제] 확인 팝업 → 모임 탭으로",
  "[강퇴] 그 사람 핑·표 삭제 · 재참여 허용",
]);

/* ══════════ ① 홈 (탭) ══════════ */
{
  const [ox,oy] = phone(Cx[0], TT, "① 홈 — 중간지점 맛보기", "전원 · 로그인 없음", C.brand);
  mapBg(ox, oy+52, 184, 230);
  R(ox+8, oy+22, 168, 22, 11, "#fff", "#D8DEE8", 1);
  T(ox+18, oy+36, "출발지 검색  ·  대중교통|자차", 8, "#98A2B3");
  ;[C.p1,C.p2,C.p3].forEach((c,i)=>{ R(ox+8+i*58, oy+48, 52, 16, 8, "#fff", "#D8DEE8", 1); out += `<circle cx="${ox+17+i*58}" cy="${oy+56}" r="4.5" fill="${c}"/>`; T(ox+25+i*58, oy+59.5, "출발지"+(i+1), 7, "#374151"); });
  pin(ox+40, oy+130, C.p1); pin(ox+150, oy+110, C.p2); pin(ox+112, oy+215, C.p3);
  badge(ox+92, oy+152, "중간지점", C.brand, "#fff");
  pin(ox+92, oy+176, C.brand, 7);
  out += `<circle cx="${ox+160}" cy="${oy+256}" r="13" fill="#fff" stroke="#D8DEE8"/>`;
  T(ox+160, oy+260, "📍", 10, "#374151", 400, "middle");
  R(ox+8, oy+288, 168, 26, 8, C.brand);
  T(ox+92, oy+304.5, "이 출발지들로 모임 만들기", 9.5, "#fff", 700, "middle");
  tabbar(ox, oy+346, 0);
}

/* ══════════ ② 모임 탭 (탭) ══════════ */
{
  const [ox,oy] = phone(Cx[1], TT, "② 모임 탭 — 통합 허브", "전원 · 재진입 허브", C.brand);
  T(ox+12, oy+38, "모임", 12, "#22252B", 700);
  ;["전체","모집","지역","지점","확정","방장","참여","지난"].forEach((c,i)=>{
    const on = i===0;

  });
  R(ox+8, oy+70, 168, 44, 8, "#FFF8E6", "#E5A400", 1.4);
  T(ox+16, oy+86, "🔔 투표하세요!", 9, "#8A6D00", 700);

  const items = [["우리 팀 회식","지역 투표 중 · D-3"],["동아리 정모","지점 투표 중 · D-7"],["가족 모임","확정됨 · 지난 모임"]];
  items.forEach((m,i)=>{

  T(ox+92, oy+296, "투표할 것 상단 고정 · 필터 7종 · 시간순", 6.8, "#98A2B3", 400, "middle");

}

/* ══════════ ③ 내정보 (탭) ══════════ */
{
  const [ox,oy] = phone(Cx[2], TT, "③ 내정보 — 설정", "전원 · 기기 저장", C.brand);
  T(ox+12, oy+38, "내정보", 12, "#22252B", 700);

  out += `<circle cx="${ox+26}" cy="${oy+71}" r="11" fill="${C.kakao}"/>`;
  T(ox+44, oy+67, "김방장", 9, "#22252B", 700);
  T(ox+44, oy+80, "카카오 로그인됨", 7.2, "#8A6D00");
  R(ox+120, oy+62, 48, 18, 9, "#fff", "#C6CEDA", 1);
  T(ox+144, oy+74, "로그아웃", 7.5, "#6B7280", 600, "middle");
  T(ox+12, oy+106, "기본 출발지", 8, "#6B7280");
  input(ox+12, oy+112, 160, "역삼역", 1);
  T(ox+12, oy+146, "기본 이동수단", 8, "#6B7280");

/* ── 줌·팬 ── */
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
let k = 1, tx = 0, ty = 0;
function apply(){ world.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`); }
function fit(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  k = Math.min(vw / W, vh / H) * 0.97;
  tx = (vw - W * k) / 2; ty = (vh - H * k) / 2;
  apply();
}
function zoomAt(cx, cy, f){
  const nk = Math.min(6, Math.max(0.1, k * f));
  const r = nk / k;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk;
  apply();
}
wrap.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18); }, { passive:false });
let dragging = false, lx = 0, ly = 0;
wrap.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
wrap.addEventListener("pointerup", () => { dragging = false; wrap.classList.remove("drag"); });
wrap.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 1.6));
document.getElementById("zi").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.3);
document.getElementById("zo").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.3);
document.getElementById("zr").onclick = fit;
window.addEventListener("resize", fit);
