<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모이머 — 오프라인</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: #f5f7fb; color: #1c2333; padding: 24px;
      }
      .box { text-align: center; max-width: 320px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #5b667e; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #2f6fed;
        border: 0; border-radius: 12px; padding: 12px 24px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" alt="" />
      <h1>연결이 끊겼어요</h1>
      <p>모이머는 모임 상태를 실시간으로 주고받아서 인터넷이 필요해요.<br />연결을 확인하고 다시 시도해 주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
